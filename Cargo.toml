[package]
name = "ssh-tunnel"
version = "0.4.10"
edition = "2021"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
raw-window-handle = "0.6"
resvg = { version = "0.45", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tray-icon = { version = "0.21", default-features = false }
wintun = "0.5.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging"] }
